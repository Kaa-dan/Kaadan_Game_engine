[package]
name = "kaadan_platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Platform abstraction layer for KaadanEngine (windowing, lifecycle)"

[lints]
workspace = true

[dependencies]
kaadan_math.workspace = true
kaadan_core.workspace = true
tracing.workspace = true
raw-window-handle.workspace = true
winit.workspace = true

# Android: enable winit's native-activity backend, which pulls in the
# `android-activity` glue and re-exports `AndroidApp`.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
