[package]
name = "kaadan_app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Application entry point and engine orchestration for KaadanEngine"

[lints]
workspace = true

[features]
default = ["gltf", "hot_reload"]
gltf = ["kaadan_renderer/gltf"]
# Desktop dev: load gameplay from a rebuilt cdylib via `ScriptHost` and
# hot-reload it. Disabled for statically-linked mobile builds, which register
# gameplay directly with `Engine::with_static_game`.
hot_reload = ["kaadan_script/hot_reload"]
profiling = ["dep:puffin"]

[dependencies]
puffin = { workspace = true, optional = true }
kaadan_math.workspace = true
kaadan_core.workspace = true
kaadan_platform.workspace = true
kaadan_renderer.workspace = true
kaadan_ecs.workspace = true
kaadan_input.workspace = true
kaadan_audio.workspace = true
kaadan_assets.workspace = true
kaadan_scene.workspace = true
kaadan_ui.workspace = true
kaadan_physics.workspace = true
kaadan_script = { workspace = true, default-features = false }
tracing.workspace = true
wgpu.workspace = true
